<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1446">
<title>AGM Gym</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="AGM Gym">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar on phone; one "next class" hero in the club's night-sky look, then lists. */
:root{
  --bg:#F3F0F8; --surface:#FFFFFF; --surface-2:#ECE7F4; --line:#DFD7EC; --neon1:#B44CFF; --neon2:#E0207A; --neon3:#18C9BB;
  --ink:#16112A; --muted:#6C6378;
  --violet:#722F9D; --violet-soft:#EADCF5; --cyan:#1FA3B0; --cyan-glow:#5EE3E8; --brand:#722F9D; --brand-2:#9D2E94; --magenta:#9D2E94; --star:#FFCC00;
  --ok:#17875E; --ok-soft:#DDF3E9; --no:#C8394F; --no-soft:#FBE3E7; --wait:#9A6A00; --wait-soft:#FFF3CC;
  --night:#0B1E25; --night-2:#2A1446; --on-night:#F7F1FF;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  --f-script:"Caveat","Segoe Script","Bradley Hand",cursive;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E0816; --surface:#170F22; --surface-2:#22172F; --line:#2E2240; --neon1:#C77DFF; --neon2:#FF5FA8; --neon3:#2EE6D6;
  --ink:#F2EEF7; --muted:#A49CB2;
  --violet:#C08AE8; --violet-soft:#2E2140; --magenta:#E77AD9; --cyan:#5EE3E8; --cyan-glow:#5EE3E8; --brand:#8A3FC8; --brand-2:#B33AA8;
  --ok:#4FD39C; --ok-soft:#123A2C; --no:#FF8094; --no-soft:#3E1C25; --wait:#F2C94C; --wait-soft:#3A2F12;
  --night:#06121A; --night-2:#2A1446; --on-night:#F7F1FF;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0816; --surface:#170F22; --surface-2:#22172F; --line:#2E2240; --neon1:#C77DFF; --neon2:#FF5FA8; --neon3:#2EE6D6;
  --ink:#F2EEF7; --muted:#A49CB2;
  --violet:#C08AE8; --violet-soft:#2E2140; --magenta:#E77AD9; --cyan:#5EE3E8; --cyan-glow:#5EE3E8; --brand:#8A3FC8; --brand-2:#B33AA8;
  --ok:#4FD39C; --ok-soft:#123A2C; --no:#FF8094; --no-soft:#3E1C25; --wait:#F2C94C; --wait-soft:#3A2F12;
  --night:#06121A; --night-2:#2A1446; --on-night:#F7F1FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--violet)}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;border-radius:12px;color:var(--muted);font-size:11px;font-weight:700;text-decoration:none}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--violet);background:var(--violet-soft)}

@media (min-width:900px){
  .shell{grid-template-columns:250px 1fr}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:26px 18px;background:var(--surface);border-right:1px solid var(--line)}
  .side .nav{display:flex;flex-direction:column;gap:4px}
  .side .tab{flex-direction:row;gap:12px;padding:11px 14px;font-size:15px;justify-content:flex-start}
  .main{padding-block:32px 48px;padding-left:40px;padding-right:40px}
}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:12px}
.mono{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 30% 25%,#5B2B8E 0%,var(--night-2) 45%,var(--night) 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.mono span{font-family:var(--f-script);font-weight:700;font-size:22px;color:#fff;letter-spacing:-.5px;transform:rotate(-6deg)}
.mono i{position:absolute;top:5px;right:7px;color:var(--star);font-style:normal;font-size:10px}
.brand b{font-family:var(--f-display);font-size:15px;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:12px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted)}
.side-foot em{font-family:var(--f-script);font-style:normal;font-size:20px;color:var(--magenta);display:block}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar .brand{display:flex}
@media (min-width:900px){.topbar .brand{display:none}}

/* ---------- child chips ---------- */
.kids{display:flex;gap:8px;flex-wrap:wrap}
.kid{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:14px}
.kid .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet);font-family:var(--f-display);font-size:13px}
.kid small{color:var(--muted);font-weight:700;font-size:12px}
.kid[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft)}
.kid.add{padding:6px 14px;color:var(--violet);border-style:dashed}

/* ---------- section heads ---------- */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sh h2{font-size:22px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.link{background:none;border:0;color:var(--violet);font-weight:800;padding:4px 0}
.page-title{display:flex;flex-direction:column;gap:6px}
.page-title h1{font-size:clamp(28px,5vw,40px);font-weight:800}
.page-title p{margin:0;color:var(--muted);max-width:60ch}
.script{font-family:var(--f-script);font-weight:700;color:var(--magenta);font-size:1.25em;line-height:1}

/* ---------- hero (next class) ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);color:var(--on-night);
  background:
    radial-gradient(120% 90% at 100% 0%,rgba(157,46,148,.55) 0%,transparent 55%),
    radial-gradient(90% 80% at 0% 100%,rgba(114,47,157,.6) 0%,transparent 60%),
    linear-gradient(160deg,var(--night-2),var(--night));
  padding:22px;display:grid;gap:18px}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.8;
  background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 32% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 76% 62%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90% 35%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 46% 88%,#fff 50%,transparent 51%)}
.hero > *{position:relative}
.hero .eyebrow{color:rgba(247,241,255,.72)}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hero h2{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.02em}
.hero .when{font-size:17px;font-weight:700}
.hero .where{color:rgba(247,241,255,.78);font-size:14px;display:flex;align-items:center;gap:6px}
.grp-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap}
.stars{color:var(--star);letter-spacing:1px}
.stars .off{opacity:.3}
.hero .note{font-size:13px;color:rgba(247,241,255,.72);margin:0}
.hero .script{color:#F7B8EF}

/* ---------- presence control ---------- */
.rsvp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rsvp button{border-radius:var(--r-md);padding:13px 10px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);transition:transform .12s ease,background .15s ease}
.rsvp button:active{transform:scale(.97)}
.rsvp button svg{width:18px;height:18px}
.rsvp .yes[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.rsvp .no[aria-pressed="true"]{background:var(--no);border-color:var(--no);color:#fff}
.hero .rsvp button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
.hero .rsvp .yes[aria-pressed="true"]{background:#1FAE78;border-color:#1FAE78}
.hero .rsvp .no[aria-pressed="true"]{background:#E0506A;border-color:#E0506A}
.reasons{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.reasons span{color:var(--muted);font-weight:700}
.hero .reasons span{color:rgba(247,241,255,.72)}
.reason{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-weight:700;font-size:13px}
.hero .reason{border-color:rgba(255,255,255,.3);color:#fff}
.reason[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- grids ---------- */
.two{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:1100px){.two{grid-template-columns:1.25fr 1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ---------- session list ---------- */
.week{display:flex;flex-direction:column;gap:8px}
.week-h{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 2px 0}
.sess{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--surface-2);padding:6px 0;line-height:1.05}
.date small{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.date b{font-family:var(--f-display);font-size:24px;font-weight:800}
.sess-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.sess-line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sess-line strong{font-size:15px}
.sess-meta{color:var(--muted);font-size:13px}
.sess .rsvp button{padding:9px 8px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--no-soft);color:var(--no)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.off{background:var(--surface-2);color:var(--muted)}
.sess.cancel{background:transparent;border-style:dashed}
.sess.cancel .date b{color:var(--muted)}
.holiday{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--violet-soft);color:var(--ink)}
.holiday .script{font-size:24px}
.holiday small{display:block;color:var(--muted);font-weight:700}

/* ---------- planning summary ---------- */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.sum b{font-family:var(--f-display);font-size:28px;display:block;line-height:1.1}
.sum span{font-size:12px;font-weight:800;color:var(--muted)}
.sum.ok b{color:var(--ok)} .sum.no b{color:var(--no)} .sum.wait b{color:var(--wait)}
.bulk{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:999px;padding:10px 18px;font-weight:800;border:1.5px solid var(--brand);background:var(--brand);color:#fff}
.btn.ghost{background:transparent;color:var(--violet)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- events ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.events{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.events{grid-template-columns:1fr 1fr}}
.ev{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;min-width:0}
.ev-top{display:flex;gap:14px;align-items:flex-start}
.ev .date{width:58px;flex:none}
.ev .kind{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.kind.stage{color:var(--violet)} .kind.compet{color:var(--magenta)} .kind.fort{color:var(--wait)}
.ev h3{font-size:18px;margin-top:2px}
.ev p{margin:0;color:var(--muted);font-size:14px}
.ev-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.cap{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted);min-width:120px;flex:1}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--magenta));border-radius:999px}
.ev.past{opacity:.55}
.ex{display:inline-block;font-size:11px;font-weight:800;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 6px;vertical-align:middle}

/* ---------- club ---------- */
.cards{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:18px}
.card p{margin:0;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mail{font-weight:800;user-select:all;word-break:break-all}
.links{display:flex;flex-direction:column}
.links a{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700}
.links a:first-child{border-top:0}
.links a span{color:var(--violet)}
.grp-table{display:flex;flex-direction:column;gap:8px}
.grp-row{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2)}
.grp-row b{font-family:var(--f-display);font-size:17px;color:var(--violet)}
.grp-row small{color:var(--muted);font-weight:700}
.grp-cat,.opt-cat{font-family:var(--f-display);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 2px 2px}
.grp-cat:first-child,.opt-cat:first-child{margin-top:0}
.opt-cat+.opts{margin-bottom:6px}
.chip-cat{flex:none;align-self:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px 0 6px}
.chip-cat:first-child{padding-left:0}
.agetag{display:inline-block;font-size:11.5px;font-weight:800;color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,transparent);padding:2px 8px;border-radius:999px;line-height:1.35;text-align:center}

/* ---------- coach ---------- */
.coach{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:800px){.coach{grid-template-columns:repeat(3,1fr)}}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,8,20,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow:auto;animation:up .22s ease}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-size:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-size:13px;font-weight:800;color:var(--muted)}
.field input{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;font:inherit;background:var(--bg);color:var(--ink)}
fieldset{border:0;padding:0;margin:0}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px;cursor:pointer}
.opt input{accent-color:var(--violet);width:18px;height:18px}
.opt:has(input:checked){border-color:var(--violet);background:var(--violet-soft)}
.opt div{display:flex;flex-direction:column}
.opt small{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:800}
.stepper b{font-family:var(--f-display);font-size:22px;min-width:24px;text-align:center}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- déroulé ---------- */
.peek{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px 10px 10px;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff}
.peek small{display:block;color:rgba(247,241,255,.72);font-size:13px}
.peek-icons{display:flex;flex:none}
.peek-icons .ico{margin-left:-8px;box-shadow:0 0 0 2px var(--night-2)}
.peek-icons .ico:first-child{margin-left:0}
.ico{width:46px;height:46px;flex:none;border-radius:50%;background:var(--c);display:grid;place-items:center}
.ico svg{width:70%;height:70%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:30px;height:30px}
.plan-head{display:flex;flex-direction:column;gap:4px}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.plan li{display:grid;grid-template-columns:46px 1fr;gap:14px;padding-bottom:16px;position:relative}
.plan li:not(:last-child)::before{content:"";position:absolute;left:22px;top:48px;bottom:2px;width:3px;border-radius:2px;background:var(--line)}
.plan b{font-family:var(--f-display);font-size:19px}

.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:900px){.dash{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;text-align:left;font:inherit;min-height:112px}
.tile-ic{font-size:22px;margin-bottom:4px}
.tile b{font-family:var(--f-display);font-size:30px;line-height:1}
.tile span:last-child{font-weight:700;font-size:14px;color:var(--muted);line-height:1.25}
.tile.warn{background:var(--wait-soft);border-color:transparent}.tile.warn b{color:var(--wait)}
.tile.good b{color:var(--ok)}
.tile.info{background:var(--violet-soft);border-color:transparent}.tile.info b{color:var(--violet)}
.tile.star b{color:var(--wait)}


/* pictos illustrés */
:root{--skin:#F7D7BF;--hair:#6B4226;--suit:#8E3FC4}
.ico{background:color-mix(in srgb,var(--c) 20%,var(--surface));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent)}
.ico svg{width:92%;height:92%;fill:none;stroke:none}
.ico .lm{stroke:var(--skin);stroke-width:4.6;stroke-linecap:round;fill:none}
.ico .hd{fill:var(--skin)} .ico .hr{fill:var(--hair)} .ico .su{fill:var(--suit)}
.ico .ap{fill:var(--c)} .ico .aps{stroke:var(--c);stroke-width:3.5;stroke-linecap:round;fill:none}
.ico .ey{fill:#2B1B3A} .ico .bl{fill:#FF7F98;opacity:.55}
.ico{width:52px;height:52px}
.ico.sm{width:34px;height:34px}
.ico.xl{width:84px;height:84px}
.plan li{grid-template-columns:52px 1fr}
.plan li:not(:last-child)::before{left:25px;top:54px}
.steps-ed li{grid-template-columns:52px 1fr auto}
.av.face{background:color-mix(in srgb,var(--violet) 18%,var(--surface));overflow:hidden}
.av.face svg{width:100%;height:100%}
.av.face .hd{fill:var(--skin)} .av.face .hr{fill:var(--hair)} .av.face .ey{fill:#2B1B3A} .av.face .bl{fill:#FF7F98;opacity:.55}
.kid .edit{font-size:12px;margin-left:-2px}
.look-preview{display:flex;gap:12px;justify-content:center;padding:6px 0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--surface);background:var(--sw);box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--violet);transform:scale(1.08)}
.badge-el .ico{filter:grayscale(1) opacity(.4)}
.badge-el.on .ico{filter:none}


/* verrou coachs */
.lock{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:12px}
.lock .logo{width:96px}
.pin-dots{display:flex;gap:14px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--violet)}
.pin-dots i.on{background:var(--violet)}
.pin-dots.bad i{border-color:var(--no);background:var(--no);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{width:72px;height:72px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:26px;font-weight:800}
.pad button:active{background:var(--violet-soft)}
.coach-bar{display:flex;justify-content:space-between;align-items:center}


/* club regroupé */
.seg a{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 6px;font-weight:800;font-size:14px;color:var(--muted);text-decoration:none}
.seg a[aria-selected="true"]{background:var(--surface);color:var(--violet);box-shadow:0 2px 8px rgba(40,20,70,.12)}
.dotbadge{background:var(--no);color:#fff;font-style:normal;font-size:11px;border-radius:999px;padding:1px 6px}
.club-head .logo{width:64px}
.tabbar{grid-template-columns:repeat(5,1fr)!important}
/* mode enfant */
.kidmode-btn{display:flex;align-items:center;gap:8px;border:2px solid var(--violet);background:var(--violet-soft);color:var(--violet);border-radius:999px;padding:4px 14px 4px 4px;font-weight:800;font-size:14px;white-space:nowrap}
body.kidmode .tabbar,body.kidmode .side{display:none}
body.kidmode .shell{grid-template-columns:1fr}
body.kidmode .main{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body.kidmode .wrap{max-width:720px}
.kid-top{display:flex;justify-content:flex-end;gap:8px}
.parent-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px}
.kid-hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.me{position:relative;border:0;background:none;padding:0}
.ico.huge{width:150px;height:150px;box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent)}
.me .ico.huge{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.me-edit{position:absolute;right:4px;bottom:8px;background:var(--surface);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.countdown{display:flex;flex-direction:column;align-items:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:22px;padding:12px 26px}
.countdown b{font-family:var(--f-display);font-size:26px}
.countdown span{font-weight:700;opacity:.9}
.kid-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px}
.kid-steps{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.kid-steps::-webkit-scrollbar{display:none}
.kid-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;font-size:13px}
.arrow{font-size:28px;color:var(--muted);flex:none}
/* premier lancement */
.onb{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;gap:18px;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overflow:auto}
.onb>*{width:100%;max-width:460px;margin-inline:auto}
.onb-top{display:flex;justify-content:space-between}
.onb-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.onb-body p{margin:0;color:var(--muted);font-size:17px;max-width:32ch}
.onb-body .logo{width:150px}
.onb-body .field{width:100%;text-align:left}
.onb-body .field input{font-size:18px;padding:14px}
.onb-body .opts.three{width:100%;grid-template-columns:repeat(3,minmax(0,1fr))}
.opt.grp{flex-direction:column;align-items:center;background:var(--surface)}
.opt.grp.on{border-color:var(--violet);background:var(--violet-soft)}
.onb-art .ico.huge{width:130px;height:130px}
.onb-dots{display:flex;justify-content:center;gap:8px}
.onb-dots i{width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .2s}
.onb-dots i.on{width:24px;background:var(--violet)}
.rsvp.demo{width:100%}
.rsvp.demo span{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;min-height:54px;font-weight:800;font-size:17px;border:1.5px solid var(--line)}
.rsvp.demo .on{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop 1.6s ease infinite}
.rsvp.demo svg{width:18px;height:18px}


.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{font-size:13px;padding:10px 2px}
.seg.five{grid-template-columns:repeat(5,1fr)}.seg.five button{font-size:12px;padding:10px 1px;white-space:nowrap}
.song-main{display:flex;flex-direction:column;min-width:0;flex:1}
.song-main b{font-size:15px;line-height:1.2}
.song-main small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


/* banque d'exercices */
.bank-f .chip.ic{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px}
.bank-f .ico.sm{width:26px;height:26px}
.bank{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow-y:auto;padding-right:2px}
.bank-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--surface-2)}
.add-ex{width:38px;height:38px;flex:none;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:22px;font-weight:800;line-height:1}
.ex-form{display:flex;flex-direction:column;gap:8px;padding:12px;border:1.5px dashed var(--line);border-radius:16px}
.ex-fields{display:flex;gap:8px;flex-wrap:wrap}
.ex-fields input{flex:2;min-width:140px}
.ex-fields select{flex:1;min-width:110px}
.ex-fields input,.ex-fields select{border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
.gear{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;background:var(--surface-2)}
.gear-row{display:flex;align-items:center;gap:10px;font-weight:700}
.gear-row input{width:20px;height:20px;accent-color:var(--brand)}
.gear-row small{margin-left:auto;color:var(--muted);font-weight:700}
.gear-row:has(input:checked) span{text-decoration:line-through;color:var(--muted)}


/* ===== modes : barre + couleurs ===== */
.modebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(30,15,50,.08)}
.modebar button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;border-radius:14px;padding:8px 6px;font-weight:800;font-size:14px;color:var(--muted);min-height:46px}
.modebar .m-ic{font-size:18px}
.modebar .av{width:28px;height:28px;border-radius:9px;flex:none}
.modebar .m-parent[aria-selected="true"]{background:#722F9D;color:#fff}
.modebar .m-kid[aria-selected="true"]{background:linear-gradient(135deg,#FF2E88,#7B5CFF);color:#fff}
.modebar .m-coach[aria-selected="true"]{background:#0F6E78;color:#fff}
body.kidmode{--bg:#F3F0F8;--surface:#FFFFFF;--surface-2:#ECE7F4;--line:#DFD7EC;--violet:#5B32E0;--violet-soft:#ECE6FF;--brand:#E0207A;--brand-2:#5B32E0;--magenta:#E0207A;--neon1:#FF2E88;--neon2:#7B5CFF;--neon3:#18C9BB}
body.coachmode{--bg:#EDF6F7;--surface-2:#DDEEF0;--line:#C9E1E4;--violet:#0F6E78;--violet-soft:#D7EEF0;--brand:#0F6E78;--brand-2:#1FA3B0;--magenta:#0F6E78}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body.kidmode{--bg:#0E0816;--surface:#170F22;--surface-2:#22172F;--line:#2E2240;--ink:#F3EEFB;--muted:#A79BBA;--violet:#B69CFF;--violet-soft:#2A1E40;--brand:#E0207A;--brand-2:#6B47F0;--magenta:#FF5FA8;--neon1:#FF2E88;--neon2:#8F74FF;--neon3:#2EE6D6}
  :root:not([data-theme="light"]) body.coachmode{--bg:#071719;--surface:#0E2427;--surface-2:#143236;--line:#1E4246;--violet:#5ED6E0;--violet-soft:#123A3E;--brand:#13808B;--brand-2:#1FA3B0;--magenta:#5ED6E0}
}
:root[data-theme="dark"] body.kidmode{--bg:#0E0816;--surface:#170F22;--surface-2:#22172F;--line:#2E2240;--ink:#F3EEFB;--muted:#A79BBA;--violet:#B69CFF;--violet-soft:#2A1E40;--brand:#E0207A;--brand-2:#6B47F0;--magenta:#FF5FA8;--neon1:#FF2E88;--neon2:#8F74FF;--neon3:#2EE6D6}
:root[data-theme="dark"] body.coachmode{--bg:#071719;--surface:#0E2427;--surface-2:#143236;--line:#1E4246;--violet:#5ED6E0;--violet-soft:#123A3E;--brand:#13808B;--brand-2:#1FA3B0;--magenta:#5ED6E0}
body.coachmode .tabbar,body.coachmode .side{display:none}
body.coachmode .shell{grid-template-columns:1fr}
body.coachmode .main{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body.coachmode .wrap{max-width:820px}
body.kidmode .modebar{border-color:var(--line)}
.coach-bar{display:flex;justify-content:space-between;align-items:center}


/* défis à la maison */
.goals{display:flex;flex-wrap:wrap;gap:6px}
.goal{background:var(--violet-soft);color:var(--violet);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.goal.won{background:var(--wait-soft);color:var(--wait)}
.hcards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none}
.hcards::-webkit-scrollbar{display:none}
.hcard{flex:none;width:min(86%,320px);scroll-snap-align:start;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 35%,transparent)}
.hc-top{display:flex;align-items:center;gap:12px}
.hc-top .ico.xl{width:76px;height:76px}
.hc-top b{font-family:var(--f-display);font-size:22px;display:block;line-height:1.1}
.hc-min{font-weight:800;font-size:13px;color:var(--muted)}
.hc-steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:8px}
.hc-steps li{counter-increment:st;display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}
.hc-steps li::before{content:counter(st);width:28px;height:28px;flex:none;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.hc-safe{font-size:12px;font-weight:800;color:var(--muted);background:var(--surface);border-radius:10px;padding:6px 10px}
.week-stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week-stamps span{display:flex;flex-direction:column;align-items:center;gap:2px}
.week-stamps i{width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-style:normal;color:#fff;font-size:15px}
.week-stamps .on i{background:var(--star);border:0;color:#7A5200}
.week-stamps .today small{color:var(--ink);font-weight:900}
.week-stamps small{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.hcard .btn.big:disabled{opacity:1;background:var(--ok);border-color:var(--ok)}
.goal-pick{display:flex;flex-wrap:wrap;gap:6px}


/* tutos en images */
.ico .su-s{stroke:var(--suit);stroke-width:10;stroke-linecap:round;fill:none}
.ico.tuto{width:64px;height:64px;border-radius:18px}
.ico.tuto.sm{width:56px;height:56px;border-radius:14px}
.ico.tuto.big{width:min(70vw,240px);height:min(70vw,240px);border-radius:32px}
.hc-steps.pics li{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.hc-steps.pics li::before{display:none}
.hc-steps.pics .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-size:12px;font-weight:800;margin-right:6px;vertical-align:1px}
.tuto-btn{width:100%}
.tuto-sheet{align-items:center;text-align:center}
.tuto-stage{position:relative;animation:pop .35s ease}
.tuto-n{position:absolute;top:-8px;left:-8px;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}
.tuto-txt{margin:0;font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.25;max-width:22ch;min-height:2.5em}
.tuto-thumbs{display:flex;gap:10px}
.tuto-thumbs button{border:3px solid transparent;border-radius:18px;padding:0;background:none}
.tuto-thumbs button.on{border-color:var(--brand)}
.tuto-ctrl{display:flex;gap:10px;width:100%}
.tuto-ctrl .btn{flex:1;font-size:18px;min-height:50px}
.tuto-ctrl .btn.ghost{flex:0 0 60px}


/* ===== mode ado ===== */
.ico .bl{display:none}
.ico .lm{stroke-width:4.1}
body.kidmode .ico{border-radius:30%}
body.kidmode .ico.huge,body.kidmode .ico.xl{border-radius:28%}
body.kidmode .script{font-family:var(--f-display);font-style:italic;font-weight:800;letter-spacing:-.03em;background:linear-gradient(95deg,var(--neon1),var(--neon2) 55%,var(--neon3));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.12em}
body.kidmode .hello{font-size:clamp(32px,8vw,46px);margin-top:4px}
body.kidmode .kid-top{justify-content:space-between;align-items:flex-start}
body.kidmode .kid-card{border-radius:22px;gap:14px}
body.kidmode .kid-card h2,body.kidmode .kid-card .sh h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.teen-next{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 20px;border-radius:26px;color:#fff;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 16px),radial-gradient(120% 120% at 100% 0%,rgba(255,46,136,.55),transparent 55%),radial-gradient(100% 100% at 0% 100%,rgba(46,230,214,.35),transparent 55%),linear-gradient(140deg,#160C26,#2B1452 60%,#3B0F4A);
  box-shadow:0 18px 40px rgba(40,10,70,.35)}
.tn-l{display:flex;flex-direction:column;gap:4px;min-width:0}
.tn-k{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.tn-j{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:64px;line-height:.95;letter-spacing:-.04em;background:linear-gradient(95deg,#FF6BB0,#B69CFF 55%,#5EF2E4);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.1em}
.tn-d{font-weight:700;font-size:15px;opacity:.88}
.tn-prog{align-self:flex-start;margin-top:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.teen-next .me .ico.huge{width:118px;height:118px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),0 0 40px rgba(123,92,255,.45);animation:none}
.teen-next .me-edit{background:#fff;color:#000;right:-4px;bottom:-4px;width:32px;height:32px;font-size:14px}
.teen-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.teen-stats div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.teen-stats b{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.teen-stats small{font-size:14px;color:var(--muted);font-weight:700}
.teen-stats span{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
body.kidmode .kid-step small{color:var(--muted);font-weight:700;font-size:12px}
body.kidmode .defi{background:linear-gradient(120deg,color-mix(in srgb,var(--neon1) 12%,var(--surface)),color-mix(in srgb,var(--neon2) 14%,var(--surface)));border:1px solid var(--line)}
body.kidmode .defi-star{color:var(--neon1);text-shadow:none}
body.kidmode .goal{background:var(--violet-soft);color:var(--violet)}
body.kidmode .goal.won{background:color-mix(in srgb,var(--neon3) 18%,var(--surface));color:color-mix(in srgb,var(--neon3) 70%,var(--ink))}
body.kidmode .hcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:22px}

body.kidmode .hc-safe{background:var(--surface-2)}
body.kidmode .week-stamps i{border-style:solid;border-width:2px}
body.kidmode .week-stamps .on i{background:linear-gradient(135deg,#FF2E88,#FF8A3D);color:#fff;font-size:14px}
.pill.fire{background:color-mix(in srgb,#FF8A3D 18%,var(--surface));color:#C2410C}
body.kidmode .badge-el{border-style:solid;border-width:1px;border-radius:16px}
body.kidmode .badge-el.on{box-shadow:0 0 0 2px var(--neon2),0 8px 22px color-mix(in srgb,var(--neon2) 30%,transparent)}
body.kidmode .bstar{color:var(--neon3);font-weight:900}


/* ===== espace parent, même style que le mode ado ===== */
body.coachmode{--neon1:#0F8C98;--neon2:#20A9B5;--neon3:#3FD8E0}
.script{font-family:var(--f-display)!important;font-style:italic;font-weight:800;letter-spacing:-.03em;font-size:1em;background:linear-gradient(95deg,var(--neon1),var(--neon2) 55%,var(--neon3));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.12em;line-height:inherit}
.hello .script{font-size:1em}
.ico{border-radius:30%}
.ico.huge,.ico.xl{border-radius:28%}
.kid-top{justify-content:space-between;align-items:flex-start}
.kid-top .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.kid-top .brand .hello{font-size:clamp(28px,7vw,40px);margin-top:2px}
.sh h2,.kid-card .sh h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;font-family:var(--f-display)}
.kid-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.pnext{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:22px 20px;border-radius:26px;color:#fff;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 16px),radial-gradient(120% 120% at 100% 0%,rgba(180,76,255,.55),transparent 55%),radial-gradient(100% 100% at 0% 100%,rgba(46,230,214,.3),transparent 55%),linear-gradient(140deg,#140C26,#2A1452 60%,#40125A);
  box-shadow:0 18px 40px rgba(40,10,70,.35)}
.pn-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pn-grp{flex:none;text-align:center;font-weight:800;font-size:14px;line-height:1.5;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
.pnext .tn-j{background:linear-gradient(95deg,#D9A3FF,#FF8CC6 55%,#5EF2E4);-webkit-background-clip:text;background-clip:text;color:transparent}
.pnext .ask{color:#fff}
.pnext .rsvp button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#fff}
.pnext .rsvp .yes[aria-pressed="true"]{background:#1FAE78;border-color:#1FAE78}
.pnext .rsvp .no[aria-pressed="true"]{background:#E0506A;border-color:#E0506A}
.pnext .reasons span{color:rgba(255,255,255,.7)}
.pnext .reason{border-color:rgba(255,255,255,.3);color:#fff}
.pnext .tn-prog{margin-top:0}
.tile{border-radius:18px;background:var(--surface)!important;border:1px solid var(--line)!important;gap:4px}
.tile-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface-2);margin-bottom:6px}
.tile b{font-size:34px;font-weight:800;letter-spacing:-.03em}
.tile b small{font-size:16px;color:var(--muted)}
.tile.warn b{color:var(--neon2)!important}.tile.warn .tile-ic{background:color-mix(in srgb,var(--neon2) 14%,var(--surface))}
.tile.info b{color:var(--neon1)!important}.tile.info .tile-ic{background:color-mix(in srgb,var(--neon1) 14%,var(--surface))}
.tile.good b{color:var(--neon3)!important}.tile.good .tile-ic{background:color-mix(in srgb,var(--neon3) 14%,var(--surface))}
.tile.star b{background:linear-gradient(95deg,var(--neon1),var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent!important}
.tile.star b small{-webkit-text-fill-color:var(--muted)}
.modebar .m-parent[aria-selected="true"]{background:linear-gradient(135deg,#8E3FC4,#B44CFF)}
.kid{border-radius:14px}
.kid[aria-pressed="true"]{border-color:var(--neon1);background:color-mix(in srgb,var(--neon1) 10%,var(--surface))}
.btn{background:var(--brand);border-color:var(--brand)}
.pill.ok{background:color-mix(in srgb,var(--neon3) 16%,var(--surface));color:color-mix(in srgb,var(--neon3) 65%,var(--ink))}
.ev,.sess,.doc,.chan,.card{border-radius:20px}
.seg a[aria-selected="true"],.seg button[aria-selected="true"]{box-shadow:0 2px 10px rgba(40,20,70,.14)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--neon1),var(--neon2));border-color:transparent;color:#fff}

.side-foot em{font-family:var(--f-display)!important;font-style:italic;font-weight:800;font-size:15px;letter-spacing:-.01em;margin-bottom:2px}

/* ===== pictos néon (direction C) ===== */
:root{--n1:#FF5FA8;--n2:#B69CFF;--n3:#5EF2E4}
.ico{background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--c) 55%,transparent),transparent 58%),radial-gradient(100% 100% at 0% 100%,rgba(46,230,214,.18),transparent 60%),linear-gradient(140deg,#140C26,#2A1452 60%,#3B0F4A)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)!important;border-radius:30%}
.ico svg{width:90%!important;height:90%!important;overflow:visible}
.ico .nl{fill:none;stroke:url(#ng);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.ico .nb{fill:none;stroke:url(#ng);stroke-width:11;stroke-linecap:round}
.ico .nt{fill:none;stroke:url(#ng);stroke-width:3.6;stroke-linecap:round}
.ico .nh{fill:url(#ng)}
.ico .nfig{filter:drop-shadow(0 0 2.5px color-mix(in srgb,var(--n2) 75%,transparent))}
.ico .ap{fill:rgba(255,255,255,.22)}
.ico .aps{fill:none;stroke:rgba(255,255,255,.26);stroke-width:3;stroke-linecap:round}
.ico .mo{fill:none;stroke:var(--n3);stroke-width:2.2;stroke-dasharray:3 4;stroke-linecap:round;opacity:.85}
.ico .bdg{fill:url(#ng)}
.ico .bdt{fill:#fff;font:900 10px var(--f-body)}
.av.face{background:linear-gradient(140deg,#140C26,#2A1452)!important;overflow:hidden}
.av.face svg{width:100%;height:100%}
.sw{background:var(--sw)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* apparence */
.theme-btn{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:20px;display:grid;place-items:center}
.topbar-right{display:flex;align-items:center;gap:8px}
.appear{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.appear button{border:0;background:transparent;border-radius:10px;padding:10px 4px;font-weight:800;font-size:14px;color:var(--muted)}
.appear button[aria-pressed="true"]{background:var(--surface);color:var(--violet);box-shadow:0 2px 8px rgba(40,20,70,.12)}
html{transition:background-color .25s}
</style>

function planFor(group,sess){
  const cp=(typeof customPlans!=='undefined')&&customPlans[`${group}|${sess.key}`];
  if(cp){ const [h1,m1]=sess.s.split(':').map(Number); let t=h1*60+m1;
    const steps=cp.steps.map(([k,m,txt])=>{const st={k,min:m,txt,at:`${Math.floor(t/60)}h${pad(t%60)}`};t+=m;return st});
    return {theme:cp.theme,defi:cp.defi,steps,total:steps.reduce((a,x)=>a+x.min,0),custom:true}; }
  const wk=Math.floor((sess.date - new Date(2026,8,7))/(7*864e5));
  const p=PLANS[((wk%3)+3+(sess.s<'12:00'?1:0))%3];
  const [h1,m1]=sess.s.split(':').map(Number),[h2,m2]=sess.e.split(':').map(Number);
  const total=(h2*60+m2)-(h1*60+m1); const w=p.steps.reduce((a,s)=>a+s[1],0);
  let t=h1*60+m1, left=total;
  const steps=p.steps.map((s,i)=>{let m=i===p.steps.length-1?left:Math.max(5,Math.round(total*s[1]/w/5)*5); left-=m;
    const st={k:s[0],min:m,txt:s[2],at:`${Math.floor(t/60)}h${pad(t%60)}`}; t+=m; return st});
  return {...p,steps,total};
}

function sessions(group, weeks=10){
  const out=[]; const g=GROUPS[group]; const seenHol=new Set();
  for(let i=0;i<weeks*7;i++){
    const d=new Date(today); d.setDate(today.getDate()+i); const s=iso(d);
    const hol=holidayOf(s);
    if(hol){ if(!seenHol.has(hol[2]) && g.slots.some(sl=>true)){seenHol.add(hol[2]);out.push({type:'hol',hol,date:d})} continue; }
    g.slots.forEach(sl=>{ if(d.getDay()===sl.d){
      out.push({type:'sess',date:d,key:`${s}|${sl.s}`,s:sl.s,e:sl.e,ferie:FERIES[s]||null});
    }});
  }
  return out;
}

const weekLabel = d => {
  const mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7));
  const diff=Math.round((mon-((()=>{const m=new Date(today);m.setDate(today.getDate()-((today.getDay()+6)%7));return m})()))/864e5/7);
  if(diff===0) return 'Cette semaine'; if(diff===1) return 'Semaine prochaine';
  return 'Semaine du '+fr(mon,{day:'numeric',month:'long'});
};

function modeBar(cur){
  const k=kid();
  return `<div class="modebar" role="tablist" aria-label="Mode">
    <button role="tab" class="m-parent" data-mode="parent" aria-selected="${cur==='parent'}"><span class="av face">${parentSvg()}</span><span>Parent</span></button>
    <button role="tab" class="m-coach" data-mode="coach" aria-selected="${cur==='coach'}"><span class="av face">${coachSvg(!(cur==='coach'&&coachOn))}</span><span>Coach</span></button>
  </div>`;
}
function vHub(seg){
  const segs=[['photos','📸 Photos'],['docs','📄 Docs'],['infos','💜 Infos']];
  const strip=h=>h.replace(/<div class="club-head">[\s\S]*?<\/div>/,'').replace(/<h1 class="hello">[\s\S]*?<\/h1>/,'');
  const docsTodo=TODO_DOCS.filter(d=>!(sent[`${kid().id}|${d.id}`]||d.init==='done')).length;
  return `<div class="club-head"><img class="logo" src="${LOGO}" alt="" width="64" height="64"><h1 class="hello">Le <span class="script">club</span></h1></div>
  <div class="seg" role="tablist">${segs.map(([id,l])=>`<a role="tab" href="#${id==='infos'?'club':id}" aria-selected="${seg===id}">${l}${id==='docs'&&docsTodo?` <i class="dotbadge">${docsTodo}</i>`:''}</a>`).join('')}</div>
  ${strip(seg==='photos'?vPhotos():seg==='docs'?vDocs():vClub())}`;
}
function render(){
  applyTheme(); applyLook();
  const raw=route(); const known=[...TABS.map(t=>t[0]),'photos','docs','coachs'];
  const r=known.includes(raw)?raw:'accueil';
  const mode=kidMode?'kid':r==='coachs'?'coach':'parent';
  document.body.classList.toggle('kidmode',mode==='kid');
  document.body.classList.toggle('coachmode',mode==='coach');
  const navId=['photos','docs','club'].includes(r)?'club':r;
  const unread=Object.values(CHANNELS).reduce((a,c)=>a+(seenCh[c.id]?0:c.unread),0);
  const nav=TABS.map(([id,l,ic])=>`<a class="tab" href="#${id}" ${id===navId?'aria-current="page"':''}><span class="tab-ic">${ic}${id==='messages'&&unread?`<i class="badge">${unread}</i>`:''}</span><span>${l}</span></a>`).join('');
  document.getElementById('sideNav').innerHTML=nav; document.getElementById('tabNav').innerHTML=nav;
  const views={accueil:vAccueil,planning:vPlanning,agenda:vAgenda,messages:vMessages,coachs:vCoachs,
    photos:()=>vHub('photos'),docs:()=>vHub('docs'),club:()=>vHub('infos')};
  document.getElementById('view').innerHTML=modeBar(mode)+views[r]();
  renderOnb();
}

/* ================= premier lancement guidé ================= */
function renderOnb(){
  const host=document.getElementById('onb');
  if(!onb){ host.innerHTML=''; return; }
  const st=onb.step; const l=look(kid());
  const dots=`<div class="onb-dots">${[0,1,2].map(i=>`<i class="${i===st?'on':''}"></i>`).join('')}</div>`;
  const screens=[
    `<img class="logo" src="${LOGO}" alt="" width="150" height="150"><h1 class="hello">Bienvenue à <span class="script">l’AGM</span> !</h1><p>Les cours, l’agenda et toutes les infos du club, au même endroit.</p>`,
    `<div class="onb-art">${ico('saut','huge')}</div><h1 class="hello">Ton <span class="script">enfant</span></h1>
     <div class="field"><label for="onbName">Son prénom</label><input id="onbName" data-onbname value="${esc(onb.name)}" maxlength="20"></div>
     ${byCat(n=>`<button class="opt grp${onb.group===n?' on':''}" data-onbgroup="${n}"><b>${n}</b>${grpTag(n)}</button>`,(c,h)=>`<div class="opt-cat">${c}</div><div class="opts three">${h}</div>`)}`,
    `<div class="onb-art">${ico('sol','huge')}</div><h1 class="hello">Avant chaque <span class="script">cours</span></h1><p>Un seul geste pour dire aux coachs si ${esc(onb.name||'ton enfant')} sera là.</p>
     <div class="rsvp demo"><span class="yes on">${I.yes}Oui</span><span class="no">${I.no}Non</span></div>`,
  ];
  host.innerHTML=`<div class="onb" role="dialog" aria-modal="true" aria-label="Présentation">
    <div class="onb-top">${st>0?'<button class="link" data-onb="back">‹ Retour</button>':'<span></span>'}<button class="link" data-onb="skip">Passer</button></div>
    <div class="onb-body">${screens[st]}</div>
    ${dots}<button class="btn big" data-onb="next">${st<2?'Suivant':'C’est parti ! 🤸'}</button></div>`;
}
function burst(r){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#FFCC00','#9D2E94','#722F9D','#2D9CDB','#27AE60','#F2994A'];
  for(let i=0;i<18;i++){const e=document.createElement('span');e.className='spark';e.textContent=i%3?'★':'●';
    const a=Math.random()*Math.PI*2, dist=60+Math.random()*90;
    e.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;color:${cols[i%cols.length]};--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist-40}px;font-size:${10+Math.random()*12}px`;
    document.body.appendChild(e); setTimeout(()=>e.remove(),900);}
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.role='status';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-close],[data-lbclose]'); if(!b) return;
  const d=b.dataset;
  if('close' in d && (b.tagName==='BUTTON'||e.target===b)){closeSheet();return}
  if(d.rsvp){ rsvp[d.key]=rsvp[d.key]===d.rsvp?undefined:d.rsvp; if(rsvp[d.key]!=='no') delete reasons[d.key]; if(!rsvp[d.key]) delete rsvp[d.key];
    const r=b.getBoundingClientRect(); save();render(); if(rsvp[d.key]==='yes'){burst(r);toast(`Youpi ! À bientôt ${kid().name} 🤸`)} else if(rsvp[d.key]) toast('C’est noté, les coachs sont prévenus'); }
  else if(d.reason){ reasons[d.key]=reasons[d.key]===d.reason?undefined:d.reason; save();render(); }
  else if(d.send){ pendingDoc=d.send; document.getElementById('docIn').click(); }
  else if(d.open){ opened[d.open]=true; store.set('opened',opened); render(); toast('📄 Le document s’ouvre ici dans la vraie appli'); }
  else if('chan' in d){ chan=d.chan||null; if(chan){seenCh[chan]=1;store.set('seen',seenCh)} render(); focusChat(); }
  else if(d.quick){ sendMsg(d.quick); }
  else if(d.heart){ const r=b.getBoundingClientRect(); hearts[d.heart]=!hearts[d.heart]; store.set('hearts',hearts); const y=document.getElementById('msgs')?.scrollTop; render(); const m=document.getElementById('msgs'); if(m&&y!=null) m.scrollTop=y; if(hearts[d.heart]) burst(r); }
  else if(d.cgroup){ coachGroup=d.cgroup; store.set('cgroup',coachGroup); draft=null; picker=false; render(); }
  else if('abs' in d){ absSheet(); }
  else if(d.ics){ downloadIcs(EVENTS.find(e=>e.id===d.ics)); }
  else if(d.cev){ coachEv=d.cev; store.set('cev',coachEv); render(); }
  else if(d.csel){ const g=coachGroup,k=`${coachEv}|${g}|${d.csel}`; csel[k]=!isSel(coachEv,g,d.csel); store.set('csel',csel); render(); toast(csel[k]?`🏅 ${d.csel} sélectionnée · ses parents sont prévenus`:`${d.csel} retirée de la sélection`); }
  else if('relance' in d){ const r=b.getBoundingClientRect(); burst(r); toast('🔔 Rappel envoyé aux parents'); }
  else if(d.ctab){ coachTab=d.ctab; store.set('ctab',coachTab); picker=false; render(); }
  else if(d.call){ const g=coachGroup,s=coachNext(g),gym=roster(g).find(x=>x.name===d.call); const k=callKey(g,s,gym); appel[k]=!isHere(g,s,gym); delete appelDone[`${g}|${s.key}`]; store.set('appel',appel); store.set('appelDone',appelDone); render(); }
  else if('appeldone' in d){ const g=coachGroup,s=coachNext(g); const r=b.getBoundingClientRect(); appelDone[`${g}|${s.key}`]=1; store.set('appelDone',appelDone); render(); burst(r); toast('✓ Appel enregistré'); }
  else if(d.min){ const [i,v]=d.min.split('|').map(Number); draft.steps[i][1]=Math.max(5,Math.min(90,draft.steps[i][1]+v)); render(); }
  else if(d.mv){ const [i,v]=d.mv.split('|').map(Number); const st=draft.steps; [st[i],st[i+v]]=[st[i+v],st[i]]; render(); }
  else if(d.rm){ if(draft.steps.length>1){ draft.steps.splice(+d.rm,1); render(); } }
  else if('picker' in d){ picker=true; render(); }
  else if(d.addstep){ draft.steps.push([d.addstep,10,'']); picker=false; render(); }
  else if('publish' in d){ const r=b.getBoundingClientRect(); customPlans[draft.key]={theme:draft.theme||'Mission gym',defi:draft.defi,steps:draft.steps.map(x=>[...x])}; store.set('plans',customPlans); render(); burst(r); toast('✓ Programme enregistré'); }
  else if(d.bgym){ badgeGym=d.bgym; render(); }
  else if(d.el){ const key=`${coachGroup}|${badgeGym}`; const arr=badges[key]=badges[key]||[]; const r=b.getBoundingClientRect(); const i=arr.indexOf(d.el); if(i>-1) arr.splice(i,1); else arr.push(d.el); store.set('badges',badges); render(); if(i===-1){burst(r);toast(`★ Badge gagné par ${badgeGym} !`)} }
  else if('mybadges' in d){ openSheet(myBadges(kid())+'<button class="btn big" data-close>Bravo ! 🎉</button>'); }
  else if(d.pin){ if(d.pin==='⌫'){pin=pin.slice(0,-1)} else if(pin.length<4){pin+=d.pin} 
    if(pin.length===4){ if(pin.length===4){ const r=b.getBoundingClientRect(); coachOn=true; pin=''; render(); burst(r); toast('👋 Bienvenue coach !'); return; } render(); setTimeout(()=>{pin='';if(route()==='coachs'&&!coachOn)render()},700); toast('Code incorrect'); return; }
    render(); }
  else if('coachout' in d){ coachOn=false; pin=''; location.hash='accueil'; toast('🔒 Espace coachs verrouillé'); }
  else if(d.onb){ if(d.onb==='back'){onb.step--} else if(d.onb==='skip'||(d.onb==='next'&&onb.step===2)){ const k=kids[0]; if(onb.name.trim()) k.name=onb.name.trim(); k.group=onb.group; activeKid=k.id; save(); store.set('onb2',true); const fin=d.onb==='next'; onb=null; location.hash='accueil'; render(); if(fin){burst(b.getBoundingClientRect());toast(`🎉 Bienvenue ${kids[0].name} !`)} return; } else {onb.step++} renderOnb(); }
  else if(d.onbgroup){ onb.group=d.onbgroup; renderOnb(); }
  else if('replay' in d){ onb={step:0,name:kid().name,group:kid().group}; renderOnb(); }
  else if('themeToggle' in d){ theme=isDark()?'light':'dark'; store.set('theme',theme); render(); }
  else if(d.themeSet){ theme=d.themeSet; store.set('theme',theme); render(); toast(theme==='dark'?'🌙 Mode sombre':theme==='light'?'☀️ Mode clair':'📱 Comme le téléphone'); }
  else if('bank' in d){ bankAdded=0; bankSheet(); }
  else if(d.bankf){ bankF=d.bankf; bankSheet(); }
  else if(d.addex){ const [k,m,...n]=d.addex.split('|'); draft.steps.push([k,+m,n.join('|')]); bankAdded++; render(); bankSheet(); toast(`+ ${n.join('|')}`); }
  else if(d.mode){ const m=d.mode; window.scrollTo(0,0);
    if(m==='coach'){ if(location.hash!=='#coachs') location.hash='coachs'; else render(); }
    else { if(route()==='coachs') location.hash='accueil'; else render(); }
    toast(m==='coach'?'🔒 Espace coachs':'👩 Espace parent'); }
  else if(d.album){ album=d.album; render(); }
  else if(d.ph){ openLb(+d.ph); }
  else if(d.lb){ const n=albumPhotos().length; openLb((lbIndex+ +d.lb+n)%n); }
  else if(d.like){ const r=b.getBoundingClientRect(); likes[d.like]=!likes[d.like]; store.set('likes',likes); if(likes[d.like]) burst(r); openLb(lbIndex); }
  else if('lbclose' in d){ if(b.tagName==='BUTTON'||e.target===b){ closeSheet(); render(); } }
  else if(d.kid){ if(d.kid!==activeKid){ activeKid=d.kid;save();render(); } }
  else if('addkid' in d){ kidSheet(); }
  else if(d.filter){ evFilter=d.filter;render(); }
  else if(d.ev){ evSheet(d.ev); }
  else if(d.step){ const g=document.getElementById('g'); g.textContent=Math.max(0,Math.min(6,+g.textContent+ +d.step)); }
  else if(d.confirm){ const g=document.getElementById('g'); const r=b.getBoundingClientRect(); regs[`${kid().id}|${d.confirm}`]={guests:g?+g.textContent:0}; save();closeSheet();render();burst(r); toast(`🎉 ${kid().name} est inscrite !`); }
  else if(d.presence){ const r=b.getBoundingClientRect(); regs[`${kid().id}|${d.presence}`]={status:'yes',at:Date.now()}; save();closeSheet();render();burst(r); toast(`🏅 Présence de ${kid().name} confirmée !`); }
  else if(d.absent){ regs[`${kid().id}|${d.absent}`]={status:'no'}; save();closeSheet();render(); toast('Absence signalée aux coachs'); }
  else if(d.unreg){ delete regs[`${kid().id}|${d.unreg}`]; save();closeSheet();render(); toast('Inscription annulée'); }
  else if(d.bulk){ const k=kid(); sessions(k.group,10).filter(s=>s.type==='sess'&&!s.ferie).forEach(s=>{const key=keyFor(k,s); if(d.bulk==='reset'){delete rsvp[key];delete reasons[key]} else if(!rsvp[key]) rsvp[key]='yes'}); const r=b.getBoundingClientRect(); save();render(); if(d.bulk==='reset') toast('Réponses effacées'); else {burst(r);toast('🎉 Super, tout est confirmé !')} }
  else if(d.copy){ const t=document.getElementById(d.copy).textContent; const done=()=>toast('Adresse copiée');
    try{navigator.clipboard.writeText(t).then(done,()=>{getSelection().selectAllChildren(document.getElementById(d.copy));toast('Adresse sélectionnée, copie-la')})}catch(err){getSelection().selectAllChildren(document.getElementById(d.copy))} }
  else if(d.toast){ toast(d.toast); }
});
document.addEventListener('input',e=>{
  if(e.target.dataset&&'onbname' in e.target.dataset){ onb.name=e.target.value; return; }
  const k=e.target.dataset&&e.target.dataset.draft; if(!k||!draft) return;
  if(k==='theme') draft.theme=e.target.value; else if(k==='defi') draft.defi=e.target.value; else { draft.steps[+k.split('|')[1]][2]=e.target.value; }
});
document.addEventListener('change',e=>{
  if(e.target.id==='absFrom'||e.target.id==='absTo'){ absPreview(); return; }
  if(e.target.id==='ack'){ const bt=document.querySelector('[data-presence]'); if(bt) bt.disabled=!e.target.checked; return; }
  if(e.target.id==='docIn'&&e.target.files.length){ const r=document.querySelector(`[data-send="${pendingDoc}"]`)?.getBoundingClientRect();
    if(pendingDoc!=='libre'){ sent[`${kid().id}|${pendingDoc}`]='Envoyé'; store.set('sent',sent); }
    render(); if(r) burst(r); toast('✓ Envoyé au club, merci !'); return; }
  if(e.target.id!=='phIn') return;
  [...e.target.files].slice(0,12).forEach(f=>{const r=new FileReader();r.onload=()=>{added.unshift({id:'u'+Date.now()+Math.random(),album,src:r.result,base:1});render()};r.readAsDataURL(f)});
  toast('📷 Photos ajoutées (sur cet appareil)');
});
document.addEventListener('submit',e=>{
  if(e.target.id==='exForm'){ e.preventDefault(); const n=document.getElementById('exName').value.trim(); if(!n) return; const k=document.getElementById('exK').value;
    myEx.push({k,n,m:10}); store.set('myEx',myEx); bankF=k; bankSheet(); toast('✏️ Exercice ajouté à ta banque'); return; }
  if(e.target.id==='absForm'){ e.preventDefault(); const list=absRange(); if(!list.length){toast('Aucun cours sur cette période');return}
    const r=(document.querySelector('[name=absR]:checked')||{}).value, k=kid(); list.forEach(s=>{const key=keyFor(k,s); rsvp[key]='no'; if(r) reasons[key]=r;});
    save(); closeSheet(); render(); toast(`✓ ${list.length} cours en absence · coachs prévenus`); return; }
  if(e.target.id==='composer'){ e.preventDefault(); sendMsg(document.getElementById('msgIn').value); return; }
  if(e.target.id!=='kidForm') return; e.preventDefault();
  const name=document.getElementById('kname').value.trim(); if(!name) return;
  const group=new FormData(e.target).get('grp'); const id='k'+Date.now();
  kids.push({id,name,group}); activeKid=id; save(); closeSheet(); render(); toast(`👋 Bienvenue ${name} !`);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();render()} if(lbIndex!==null&&document.querySelector('.lb')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const n=albumPhotos().length;openLb((lbIndex+(e.key==='ArrowRight'?1:-1)+n)%n)}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
document.getElementById("sideLogo").src=LOGO;
render();
</script>
